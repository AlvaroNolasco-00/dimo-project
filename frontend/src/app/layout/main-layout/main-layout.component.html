<div class="app-container" [class.has-sidebar]="showSidebar()" [class.sidebar-collapsed]="isSidebarCollapsed()">

    <!-- Sidebar (Left Column) -->
    @if (showSidebar()) {
    <div class="sidebar-wrapper">
        <app-shared-sidebar [menuItems]="currentMenuItems()" [logoText]="logoText()"
            [isCollapsed]="isSidebarCollapsed()" (toggleCollapse)="toggleSidebar()">
        </app-shared-sidebar>
    </div>
    }

    <!-- Main Content Area (Right Column) -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <app-navbar-top></app-navbar-top>

        <!-- Main Router Content -->
        <div class="content-wrapper">
            <div class="sidebar-backdrop" [class.visible]="layoutService.sidebarOpen()"
                (click)="layoutService.closeSidebar()">
            </div>

            <main class="main-content">
                <router-outlet #outlet="outlet"></router-outlet>
            </main>
        </div>
    </div>
</div>
