type: web
name: dimo-project
git:
  branch: main
  paths:
    - backend/**
runtime: python
build:
  command: pip install -r requirements.txt
run:
  command: python -m backend.scripts.run_migrations && gunicorn -w 1 -k uvicorn.workers.UvicornWorker backend.main:app
ports:
  - port: 8000
    path: /
    protocol: http
env:
  PYTHONPATH: .
